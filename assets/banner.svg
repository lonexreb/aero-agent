<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e10600"/>
      <stop offset="50%" style="stop-color:#ff3b3b"/>
      <stop offset="100%" style="stop-color:#e10600"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00d4ff;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#7b61ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7b61ff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="flowline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#e10600;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e10600;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1200" height="320" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Background -->
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- Grid pattern -->
    <g opacity="0.06" stroke="#ffffff" stroke-width="0.5">
      <line x1="0" y1="40" x2="1200" y2="40"/>
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="280" x2="1200" y2="280"/>
      <line x1="100" y1="0" x2="100" y2="320"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="300" y1="0" x2="300" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="500" y1="0" x2="500" y2="320"/>
      <line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="700" y1="0" x2="700" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="900" y1="0" x2="900" y2="320"/>
      <line x1="1000" y1="0" x2="1000" y2="320"/>
      <line x1="1100" y1="0" x2="1100" y2="320"/>
    </g>

    <!-- CFD streamlines -->
    <g filter="url(#blur1)">
      <path d="M0 180 Q200 160 400 175 T800 155 T1200 170" stroke="url(#flowline)" stroke-width="1.5" fill="none" opacity="0.5"/>
      <path d="M0 195 Q250 175 500 190 T900 170 T1200 185" stroke="url(#flowline)" stroke-width="1" fill="none" opacity="0.4"/>
      <path d="M0 210 Q300 195 550 205 T950 188 T1200 200" stroke="url(#flowline)" stroke-width="1" fill="none" opacity="0.3"/>
      <path d="M0 165 Q150 148 350 160 T750 142 T1200 155" stroke="url(#flowline)" stroke-width="1" fill="none" opacity="0.35"/>
      <path d="M0 225 Q200 215 450 220 T850 205 T1200 215" stroke="url(#flowline)" stroke-width="0.8" fill="none" opacity="0.25"/>
    </g>

    <!-- Simplified F1 car silhouette (side view) -->
    <g transform="translate(780, 135) scale(0.9)" opacity="0.12" fill="#ffffff">
      <!-- Body -->
      <path d="M0 60 L30 55 L60 40 L100 35 L160 30 L200 25 L240 22 L280 20 L300 22 L310 30 L320 28 L340 15 L350 12 L360 15 L365 28 L370 35 L380 40 L380 60 L370 65 L340 65 L330 55 L310 55 L300 65 L100 65 L90 55 L70 55 L60 65 L20 65 Z"/>
      <!-- Front wing -->
      <path d="M0 62 L-20 58 L-25 65 L5 65 Z"/>
      <!-- Rear wing -->
      <path d="M340 8 L385 5 L388 15 L365 18 Z"/>
      <!-- Wheels -->
      <circle cx="75" cy="62" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
      <circle cx="335" cy="62" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
      <!-- Halo -->
      <path d="M200 25 Q220 10 240 22" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Pressure field visualization (colored dots) -->
    <g opacity="0.15">
      <circle cx="850" cy="165" r="25" fill="#0066ff" filter="url(#blur2)"/>
      <circle cx="900" cy="155" r="20" fill="#00aaff" filter="url(#blur2)"/>
      <circle cx="950" cy="160" r="30" fill="#00ddff" filter="url(#blur2)"/>
      <circle cx="1000" cy="170" r="18" fill="#00ffcc" filter="url(#blur2)"/>
      <circle cx="1050" cy="165" r="22" fill="#00ff88" filter="url(#blur2)"/>
      <circle cx="820" cy="180" r="15" fill="#ff3300" filter="url(#blur2)"/>
      <circle cx="870" cy="190" r="12" fill="#ff6600" filter="url(#blur2)"/>
    </g>

    <!-- Top red accent line -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

    <!-- Red glow at top -->
    <rect x="0" y="0" width="1200" height="40" fill="url(#glow)"/>

    <!-- Main title -->
    <text x="80" y="115" font-family="'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">
      Aero<tspan fill="#e10600">Agent</tspan>
    </text>

    <!-- Subtitle -->
    <text x="83" y="152" font-family="'SF Mono', 'Cascadia Code', 'Fira Code', monospace" font-size="16" fill="#8b949e" letter-spacing="3">
      MULTI-DOMAIN F1 DEVELOPMENT PLATFORM
    </text>

    <!-- Tagline -->
    <text x="83" y="185" font-family="'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9" opacity="0.85">
      6 domain agents. One goal: make every simulation count.
    </text>

    <!-- Metric badges -->
    <g transform="translate(83, 215)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="80" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#e10600"/>
      <text x="28" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Aero</text>

      <!-- Badge 2 -->
      <rect x="92" y="0" width="110" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="108" cy="16" r="4" fill="#00d4ff"/>
      <text x="120" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Materials</text>

      <!-- Badge 3 -->
      <rect x="214" y="0" width="115" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="230" cy="16" r="4" fill="#7b61ff"/>
      <text x="242" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Chemistry</text>

      <!-- Badge 4 -->
      <rect x="341" y="0" width="115" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="357" cy="16" r="4" fill="#ff9500"/>
      <text x="369" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Structural</text>

      <!-- Badge 5 -->
      <rect x="468" y="0" width="105" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="484" cy="16" r="4" fill="#ff3b3b"/>
      <text x="496" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">Thermal</text>

      <!-- Badge 6 -->
      <rect x="585" y="0" width="115" height="32" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="601" cy="16" r="4" fill="#3fb950"/>
      <text x="613" y="21" font-family="'SF Mono', monospace" font-size="11" fill="#8b949e">ERS/Strategy</text>
    </g>

    <!-- Version / status tag -->
    <g transform="translate(83, 268)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1f1f1f" stroke="#e10600" stroke-width="1"/>
      <text x="30" y="15" font-family="'SF Mono', monospace" font-size="10" fill="#e10600" text-anchor="middle">v0.1.0</text>
      <rect x="70" y="0" width="115" height="22" rx="4" fill="#1f1f1f" stroke="#30363d" stroke-width="1"/>
      <text x="127" y="15" font-family="'SF Mono', monospace" font-size="10" fill="#8b949e" text-anchor="middle">Python 3.11+</text>
      <rect x="195" y="0" width="145" height="22" rx="4" fill="#1f1f1f" stroke="#30363d" stroke-width="1"/>
      <text x="267" y="15" font-family="'SF Mono', monospace" font-size="10" fill="#8b949e" text-anchor="middle">PRE-RELEASE</text>
    </g>

    <!-- Bottom accent line -->
    <rect x="0" y="317" width="1200" height="3" fill="url(#accent)"/>
  </g>
</svg>
